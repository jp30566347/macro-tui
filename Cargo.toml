[package]
name = "macro-tui"
version = "0.1.0"
edition = "2021"
description = "Macro market overview and news in your terminal"
license = "MIT"
readme = "README.md"
keywords = ["markets", "finance", "tui", "terminal", "stocks"]
categories = ["command-line-utilities"]
exclude = [".github/"]

[[bin]]
name = "macro-tui"
path = "src/main.rs"
doc = false

[profile.release]
lto = true
strip = "symbols"
opt-level = 3
codegen-units = 1

[dependencies]
ratatui = { version = "0.30", features = ["crossterm"] }
crossterm = { version = "0.29", features = ["event-stream"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }
tokio-util = "0.7"
futures = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
color-eyre = "0.6"
clap = { version = "4", features = ["derive"] }
chrono = { version = "0.4", features = ["serde"] }
toml = "1"
dirs = "6"
quick-xml = "0.42"
